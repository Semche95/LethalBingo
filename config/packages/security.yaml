security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # 5 failed attempts per username and IP, 10 per IP (see rate_limiter below)
            login_throttling:
                limiter: app.login_rate_limiter
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_referee_dashboard
                enable_csrf: true
            # "Se souvenir de moi" on the login page; signed with the user's password hash,
            # so changing the password invalidates the cookie
            remember_me:
                secret: '%kernel.secret%'
                lifetime: '%app.remembered_session_idle_timeout%'
            logout:
                path: app_logout
                # POST form carrying the "logout" token in a field named "token" (CsrfInput component)
                enable_csrf: true
                csrf_parameter: token
                # where to redirect after logout
                # target: app_any_route

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    role_hierarchy:
        ROLE_ADMIN: ROLE_REFEREE
        ROLE_REFEREE: ROLE_USER

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/referee, roles: ROLE_REFEREE }

framework:
    rate_limiter:
        # Failed logins for one username from one IP
        login_local:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        # Failed logins from one IP, whatever the username
        login_global:
            policy: fixed_window
            limit: 10
            interval: '15 minutes'

services:
    app.login_rate_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.login_global'
            $localFactory: '@limiter.login_local'
            $secret: '%kernel.secret%'

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
