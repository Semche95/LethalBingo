mercure:
    hubs:
        default:
            url: '%env(default::MERCURE_URL)%'
            public_url: '%env(default::MERCURE_PUBLIC_URL)%'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
                # RFC 9068 access token claims required by the Mercure 1.0 protocol;
                # "iss" matches the issuer block of frankenphp/Caddyfile
                claims:
                    iss: 'https://lethalbingo.app'
                    sub: 'lethalbingo'
                    client_id: 'lethalbingo'
