version: 2

# Updates are grouped per ecosystem (one PR each). The "Dependabot regenerate"
# CI job pushes the files generated from the dependencies to the PR, then the
# "Dependabot merge" job merges it once the checks pass.
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore(config)
      groups:
          composer:
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore(config)
      # Symfony UX packages are linked from vendor/ and follow Composer.
      ignore:
          - dependency-name: '@symfony/ux-*'
      groups:
          npm:
              patterns: ['*']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore(config)
      groups:
          github-actions:
              patterns: ['*']

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore(config)
