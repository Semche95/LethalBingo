---
# Development environment override
services:
  php:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - ./frankenphp/vite.caddy:/etc/frankenphp/vite.caddy:ro
      # Locally trusted certificate: bind-mounted, never copied into an image
      - ./certs:/etc/caddy/certs:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      MERCURE_EXTRA_DIRECTIVES: demo
      CADDY_SERVER_EXTRA_DIRECTIVES: import /etc/frankenphp/vite.caddy
      CADDY_SERVER_TLS: tls /etc/caddy/certs/cert.pem /etc/caddy/certs/cert-key.pem
      SERVER_NAME: lethalbingo.localhost
      MERCURE_PUBLIC_URL: https://lethalbingo.localhost/.well-known/mercure
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025"
      - "8025"
    env_file:
      - .env
      - .env.local
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
