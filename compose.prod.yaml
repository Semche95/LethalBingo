name: bingo
services:
  php:
    build:
      context: .
      target: frankenphp_prod
    env_file:
      - .env.prod.local
    ports: !reset []
    volumes:
      - ./var:/app/var
    labels:
      caddy: bingo.semche.ovh
      caddy_ingress_network: lcbingo
      caddy.reverse_proxy: "{{upstreams http}}"

networks:
  default:
    name: lcbingo
